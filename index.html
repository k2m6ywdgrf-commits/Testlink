<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi ETF & Actions Automatisé</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 650px;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 1rem;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
            background-color: #f1f5f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            margin-top: 1.5rem;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }
        th {
            font-weight: 600;
            color: #64748b;
        }
        .price {
            font-weight: bold;
            text-align: right;
            color: #0f172a;
        }
        .btn-refresh {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            font-weight: 600;
        }
        .btn-refresh:hover {
            background-color: #1d4ed8;
        }
        .btn-refresh:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .status {
            font-size: 0.9rem;
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Automatisation ISIN ➡️ Prix</h1>
    <p class="subtitle">Colle tes codes ISIN ci-dessous (un par ligne) :</p>
    
    <textarea id="isin-input" spellcheck="false" placeholder="Exemples :&#10;FR0011871128&#10;FR0011550193&#10;FR0013412020"></textarea>
    
    <button id="run-btn" class="btn-refresh" onclick="processISINs()">Traduire & Chercher les prix</button>
    <div id="status-msg" class="status"></div>

    <table id="results-table" style="display: none;">
        <thead>
            <tr>
                <th>ISIN / Ticker</th>
                <th>Nom du produit</th>
                <th class="price">Prix Actuel</th>
            </tr>
        </thead>
        <tbody id="portfolio-body">
            </tbody>
    </table>
</div>

<script>
    // Ajout des ISINs par défaut au chargement
    document.getElementById('isin-input').value = "FR0011871128\nFR0011550193\nFR0013412020";

    // Fonction utilitaire pour utiliser le proxy CORS
    async function fetchWithProxy(url) {
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&t=${Date.now()}`;
        const response = await fetch(proxyUrl);
        if (!response.ok) throw new Error('Erreur réseau');
        const data = await response.json();
        return JSON.parse(data.contents);
    }

    async function processISINs() {
        const input = document.getElementById('isin-input').value;
        const statusMsg = document.getElementById('status-msg');
        const btn = document.getElementById('run-btn');
        const table = document.getElementById('results-table');
        const tbody = document.getElementById('portfolio-body');
        
        // 1. Extraction et nettoyage des codes ISIN
        // On sépare par ligne, on retire les espaces, on met en majuscule, et on garde ceux qui font 12 caractères.
        const isins = input.split('\n')
                           .map(s => s.trim().toUpperCase())
                           .filter(s => s.length === 12);
        
        if (isins.length === 0) {
            statusMsg.style.color = '#dc2626';
            statusMsg.textContent = "Aucun code ISIN valide détecté. (Un ISIN doit faire 12 caractères).";
            return;
        }

        // État de chargement
        btn.disabled = true;
        table.style.display = 'none';
        tbody.innerHTML = '';
        statusMsg.style.color = '#2563eb';

        try {
            // 2. Traduction ISIN -> Ticker
            statusMsg.textContent = "Étape 1/2 : Recherche des Tickers correspondants...";
            const portfolio = [];
            
            for (const isin of isins) {
                // Requête vers le moteur de recherche Yahoo Finance
                const searchUrl = `https://query2.finance.yahoo.com/v1/finance/search?q=${isin}&newsCount=0`;
                const searchData = await fetchWithProxy(searchUrl);
                
                if (searchData.quotes && searchData.quotes.length > 0) {
                    const quote = searchData.quotes[0]; // On prend le premier résultat trouvé
                    portfolio.push({
                        isin: isin,
                        ticker: quote.symbol,
                        name: quote.shortname || quote.longname || "Nom inconnu"
                    });
                } else {
                    portfolio.push({
                        isin: isin,
                        ticker: null,
                        name: "Introuvable sur Yahoo"
                    });
                }
            }

            // 3. Récupération des prix
            statusMsg.textContent = "Étape 2/2 : Récupération des prix en direct...";
            const validTickers = portfolio.filter(p => p.ticker).map(p => p.ticker).join(',');
            let pricesData = { quoteResponse: { result: [] } };
            
            if (validTickers.length > 0) {
                // Requête vers l'API des cours boursiers
                const yfUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${validTickers}`;
                pricesData = await fetchWithProxy(yfUrl);
            }
            
            const quotes = pricesData.quoteResponse.result;

            // 4. Construction et affichage du tableau
            statusMsg.textContent = "";
            table.style.display = 'table';
            
            tbody.innerHTML = portfolio.map(item => {
                let priceDisplay = 'N/A';
                
                if (item.ticker) {
                    const quote = quotes.find(q => q.symbol === item.ticker);
                    if (quote && quote.regularMarketPrice) {
                        // Formatage du prix selon la devise
                        priceDisplay = new Intl.NumberFormat('fr-FR', { 
                            style: 'currency', 
                            currency: quote.currency || 'EUR' 
                        }).format(quote.regularMarketPrice);
                    }
                }

                return `
                    <tr>
                        <td>
                            ${item.isin} <br>
                            <small style="color:#94a3b8">${item.ticker || 'Aucun Ticker'}</small>
                        </td>
                        <td>${item.name}</td>
                        <td class="price">${priceDisplay}</td>
                    </tr>
                `;
            }).join('');

        } catch (error) {
            console.error('Erreur :', error);
            statusMsg.style.color = '#dc2626';
            statusMsg.textContent = "Une erreur est survenue lors de la communication avec l'API.";
        } finally {
            btn.disabled = false;
            btn.textContent = 'Traduire & Chercher les prix';
        }
    }
</script>
</body>
</html>
